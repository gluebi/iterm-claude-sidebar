<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sessions</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --hover:#f0f0f3; --line:#d9d9de; --busy:#0a6cff; --waiting:#b36b00; --done:#1a7f37; --failed:#cf222e; --card:#fff; --shadow:0 10px 30px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.08); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1e1e; --fg:#f2f2f7; --muted:#a1a1a6; --hover:#2c2c2e; --line:#3a3a3c; --busy:#4d9aff; --waiting:#f0a63a; --done:#3fb950; --failed:#ff6b6b; --card:#2b2b2e; --shadow:0 10px 30px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05); } }
  body { margin:0; padding:8px; display:flex; flex-direction:column; min-height:100vh; box-sizing:border-box; background:var(--bg); color:var(--fg); font:13px/1.35 -apple-system, system-ui, sans-serif; }
  .tools { display:flex; gap:6px; position:sticky; top:0; background:var(--bg); padding-bottom:6px; }
  input, select { min-width:0; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  input { flex:1; }
  header { display:flex; align-items:center; margin:12px 0 2px; }
  h2 { flex:1; margin:0; min-width:0; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .fold { all:unset; display:flex; align-items:center; gap:6px; cursor:pointer; border-radius:4px; padding:2px 4px; }
  .fold:hover, .fold:focus-visible { background:var(--hover); } .fold:focus-visible { outline:2px solid var(--busy); }
  .dots { display:flex; gap:3px; } .dots .dot { margin-top:0; width:7px; height:7px; }
  .icon { all:unset; cursor:pointer; padding:2px 6px; border-radius:4px; color:var(--muted); }
  .icon:hover, .icon:focus-visible { background:var(--hover); color:var(--fg); }
  .icon[aria-pressed=true] { color:var(--busy); }
  .row { all:unset; box-sizing:border-box; display:flex; width:100%; gap:8px; align-items:flex-start; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .row:hover, .row:focus-visible { background:var(--hover); }
  .row:focus-visible, .icon:focus-visible { outline:2px solid var(--busy); }
  .dot { flex:none; width:9px; height:9px; margin-top:4px; border-radius:50%; background:var(--c); }
  .busy { --c:var(--busy); animation:pulse 1.4s ease-in-out infinite; } .waiting { --c:var(--waiting); } .idle { --c:var(--done); } .failed { --c:var(--failed); }
  @media (prefers-reduced-motion: reduce) { .busy { animation:none; } }
  @keyframes pulse { 50% { opacity:.35; } }
  .body { min-width:0; flex:1; } .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--muted); font-size:11px; display:flex; flex-wrap:wrap; gap:2px 8px; }
  .new { background:var(--done); color:#fff; border-radius:8px; padding:0 6px; font-size:10px; align-self:center; }
  .chip { all:unset; cursor:pointer; text-decoration:underline; } .chip:focus-visible { outline:2px solid var(--busy); }
  main { flex:1; }
  footer { margin-top:14px; padding-top:8px; border-top:1px solid var(--line); display:grid; gap:4px; font-size:11px; }
  .limit { display:grid; grid-template-columns:20px 1fr 34px; gap:6px; align-items:center; }
  .limit .track { height:6px; border-radius:3px; background:var(--hover); overflow:hidden; }
  .limit .fill { height:100%; background:var(--done); } .limit.warn .fill { background:var(--waiting); } .limit.high .fill { background:var(--failed); }
  .limit .pct { text-align:right; font-variant-numeric:tabular-nums; } .limit .reset { grid-column:2 / 4; color:var(--muted); margin-top:-3px; }
  .limit.stale { opacity:.55; }
  .item { position:relative; }
  .edit { position:absolute; top:5px; right:4px; opacity:0; }
  .peek-btn { position:absolute; top:5px; right:26px; opacity:0; }
  .item:hover .edit, .edit:focus-visible, .item:hover .peek-btn, .peek-btn:focus-visible, .peek-btn[aria-expanded=true] { opacity:1; } .item:hover .new { visibility:hidden; }
  input.field { all:unset; box-sizing:border-box; flex:1; min-width:0; padding:1px 4px; border:1px solid var(--busy); border-radius:4px; background:var(--bg); color:var(--fg); }
  .peek-resize { display:none; position:absolute; left:-9px; top:12px; bottom:12px; width:14px; cursor:col-resize; touch-action:none; }
  .peek-resize::after { content:''; position:absolute; left:6px; top:calc(50% - 20px); width:3px; height:40px; border-radius:2px; background:var(--line); }
  .peek-resize:hover::after, .peek-resize:focus-visible::after { background:var(--busy); } .peek-resize:focus-visible { outline:none; }
  .item.peeked > .row { background:var(--hover); }
  .peek { position:absolute; z-index:20; left:-2px; right:-2px; top:calc(100% + 2px); display:grid; grid-template-columns:minmax(0, 1fr); gap:8px; padding:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); transform-origin:50% 0; }
  .peek.flip { top:auto; bottom:calc(100% + 2px); transform-origin:50% 100%; }
  .peek.enter { animation:peek-in .18s cubic-bezier(.2,.8,.2,1) both; } .peek.flip.enter { animation-name:peek-in-up; }
  .peek.leave { animation:peek-out .14s ease-in both; pointer-events:none; } .peek.flip.leave { animation-name:peek-out-up; }
  @keyframes peek-in { from { opacity:0; transform:translateY(-8px) scale(.96); } }
  @keyframes peek-in-up { from { opacity:0; transform:translateY(8px) scale(.96); } }
  @keyframes peek-out { to { opacity:0; transform:translateY(-8px) scale(.96); } }
  @keyframes peek-out-up { to { opacity:0; transform:translateY(8px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { .peek.enter, .peek.leave { animation:none; } }
  .peek-head { display:flex; align-items:center; gap:8px; }
  .peek-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:11px; }
  .seg-group { display:flex; padding:2px; border-radius:8px; background:var(--hover); }
  .seg { all:unset; cursor:pointer; padding:2px 9px; border-radius:6px; font-size:11px; color:var(--muted); }
  .seg[aria-pressed=true] { background:var(--card); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.18); }
  .seg:focus-visible { outline:2px solid var(--busy); }
  .peek-body { box-sizing:border-box; max-height:min(260px, 40vh); overflow:auto; border-radius:8px; background:var(--hover); padding:8px; font:11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  .peek-body.screen { white-space:pre; overflow-wrap:normal; }
  .peek-body.transcript { font:12px/1.4 -apple-system, system-ui, sans-serif; }
  .msg { margin-bottom:8px; } .msg:last-child { margin-bottom:0; }
  .msg .who { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .msg.user .who { color:var(--busy); } .msg.assistant .who { color:var(--done); }
  .msg .line { white-space:pre-wrap; } .msg .tool { color:var(--muted); font:11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .composer { display:flex; align-items:center; gap:6px; padding:4px 4px 4px 12px; border:1px solid var(--line); border-radius:999px; background:var(--bg); }
  .composer:focus-within { border-color:var(--busy); box-shadow:0 0 0 3px color-mix(in srgb, var(--busy) 25%, transparent); }
  .composer-input { all:unset; flex:1; min-width:0; color:var(--fg); } .composer-input::placeholder { color:var(--muted); }
  .send-btn { all:unset; cursor:pointer; flex:none; width:24px; height:24px; border-radius:50%; background:var(--busy); color:#fff; text-align:center; line-height:24px; font-weight:700; }
  .send-btn:hover { filter:brightness(1.12); } .send-btn:focus-visible { outline:2px solid var(--fg); outline-offset:1px; }
  .actions { display:flex; align-items:center; gap:6px; }
  .pill { all:unset; cursor:pointer; padding:3px 10px; border:1px solid var(--line); border-radius:999px; font-size:11px; }
  .pill:hover, .pill:focus-visible { background:var(--hover); } .pill:focus-visible { outline:2px solid var(--busy); }
  .pill[data-armed] { border-color:var(--failed); color:var(--failed); }
  .hint { margin-left:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:10px; }
  .send-note { font-size:11px; color:var(--waiting); } .send-note.error { color:var(--failed); }
  .chip { color:inherit; }
  @media (min-width: 720px) {
    body { padding:16px 24px; }
    .tools, footer { max-width:480px; }
    main { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap:16px; align-content:start; }  /* auto-fit: columns without a card collapse, so cards stretch to the full width */
    .items { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); column-gap:12px; }  /* a wide card flows its sessions into columns */
    .group { align-self:start; padding:2px 8px 8px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
    #closed { grid-column:1 / -1; }
    .peek, .peek.flip { box-sizing:border-box; position:fixed; top:16px; right:16px; bottom:16px; left:auto; width:var(--peek-w, min(520px, 42vw)); transform-origin:100% 50%; grid-template-rows:auto minmax(0, 1fr) auto auto auto; z-index:30; }
    .peek-body { max-height:none; min-height:0; }
    body:has(.peek) main { margin-right:calc(var(--peek-w, min(520px, 42vw)) + 28px); }
    .peek-resize { display:block; }
    .peek.enter, .peek.flip.enter { animation-name:peek-in-side; } .peek.leave, .peek.flip.leave { animation-name:peek-out-side; }
    @keyframes peek-in-side { from { opacity:0; transform:translateX(16px); } }
    @keyframes peek-out-side { to { opacity:0; transform:translateX(16px); } }
  }
  .term-view { position:fixed; inset:0; z-index:60; display:grid; grid-template-rows:auto minmax(0, 1fr) auto; background:#161618; color:#e6e6e6; }
  .term-bar, .term-keys { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#242427; font-size:12px; }
  .term-bar .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .term-bar .status { color:#9a9aa0; } .term-bar .status.live { color:#3fb950; }
  .term-bar button, .term-keys button { all:unset; cursor:pointer; padding:3px 10px; border:1px solid #3a3a3e; border-radius:999px; }
  .term-bar button:hover, .term-keys button:hover, .term-bar button:focus-visible, .term-keys button:focus-visible { background:#34343a; outline:none; box-shadow:0 0 0 2px #4d9aff; }
  .term-keys { flex-wrap:wrap; } .term-bar button[hidden] { display:none; }
  .term-host { display:grid; place-items:center; min-height:0; overflow:hidden; padding:8px; }
  .empty { color:var(--muted); padding:8px; } .err { color:var(--failed); padding:4px; }
  details { margin-top:14px; } summary { cursor:pointer; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:0 4px; }
</style>
</head>
<body>
<div class="tools">
  <input id="filter" type="search" placeholder="Filter…" aria-label="Filter sessions" data-testid="sidebar-filter">
  <select id="hide" aria-label="Hide done sessions older than" data-testid="sidebar-hide-idle">
    <option value="0">All</option><option value="1">&lt; 1h</option><option value="4">&lt; 4h</option><option value="24">&lt; 24h</option>
  </select>
</div>
<main id="list" data-testid="sidebar-list" aria-live="polite"></main>
<footer id="limits" data-testid="sidebar-limits" aria-label="Usage limits"></footer>
<script>
const $ = s => document.querySelector(s);
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function build(tag, props, kids = []) {
  const { key, testid, ...rest } = props, e = document.createElement(tag);
  for (const [k, v] of Object.entries(rest)) k.startsWith('aria-') ? e.setAttribute(k, v) : (e[k] = v);
  if (key) e.dataset.key = key;
  if (testid) e.dataset.testid = testid;
  e.append(...kids.filter(Boolean));
  return e;
}
const toggle = (set, name, storeKey) => { set.has(name) ? set.delete(name) : set.add(name); store.set(storeKey, [...set]); render(); };
const ago = ms => { const s = Math.max(0, (Date.now() - ms) / 1000 | 0); return s < 60 ? s + 's' : s < 3600 ? (s / 60 | 0) + 'm' : s < 86400 ? (s / 3600 | 0) + 'h' : (s / 86400 | 0) + 'd'; };
const get = path => fetch(path, { headers: { 'X-Sidebar': '1' } });
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'X-Sidebar': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

let pinned = new Set(store.get('pinned', []));
let collapsed = new Set(store.get('collapsed', []));
const isCollapsed = g => collapsed.has(g.project) && !$('#filter').value;
$('#hide').value = store.get('hide', '0');
$('#filter').value = store.get('filter', '');
let data = { groups: [], closed: [] };

let editing = false;  // pauses re-rendering so the input isn't destroyed mid-edit
let peeking = null, peekMode = 'transcript', peekPayload = null, peekStick = true, peekBusy = false, peekEnter = false, closing = false, sendText = '', sendNote = null;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function renderNote() {
  const el = document.querySelector('[data-testid="send-note"]');
  if (!el) return;
  el.className = 'send-note' + (sendNote?.kind === 'error' ? ' error' : '');
  el.replaceChildren(...[sendNote && sendNote.text, sendNote?.retry && build('button', { className: 'chip', textContent: 'Send anyway', onclick: sendNote.retry })].filter(Boolean));
}

async function sendTo(s, payload) {
  const r = await post('/api/send', { id: s.id, ...payload });
  if (r.ok) {
    sendNote = { text: 'Sent' };
    if (payload.text) { sendText = ''; const input = document.querySelector('[data-testid="send-input"]'); if (input) input.value = ''; }
    peekTick();
  } else if (r.status === 409) {
    sendNote = { kind: 'error', text: (await r.json()).detail, retry: () => sendTo(s, { ...payload, force: true }) };
  } else {
    sendNote = { kind: 'error', text: r.status === 404 ? 'Session is not open in iTerm' : 'Could not send' };
  }
  renderNote();
}

function fillBody(body, payload) {
  body.className = 'peek-body ' + peekMode;
  if (peekMode === 'screen') { body.textContent = payload.lines.join('\n'); return; }
  const items = payload.items.length ? payload.items : [{ role: 'note', text: 'No messages yet.' }];
  body.replaceChildren(...items.map(i => build('div', { className: 'msg ' + i.role }, [
    build('span', { className: 'who', textContent: i.role === 'user' ? 'you' : i.role === 'assistant' ? 'claude' : '' }),
    ...i.text.split('\n').map(line => build('div', { className: line.startsWith('▸ ') ? 'tool' : 'line', textContent: line })),
  ])));
}

async function peekTick() {
  if (!peeking || peekBusy || closing || document.hidden) return;
  peekBusy = true;
  const id = peeking, mode = peekMode;
  try {
    const r = await get(`/api/peek?id=${encodeURIComponent(id)}&mode=${mode}`);
    const payload = r.ok ? await r.json() : { items: [], lines: [r.status === 404 && mode === 'screen' ? 'Not open in iTerm.' : 'Unavailable.'] };
    const body = document.querySelector('[data-testid="peek-body"]');
    if (id === peeking && mode === peekMode && JSON.stringify(payload) !== JSON.stringify(peekPayload)) {
      peekPayload = payload;
      if (body) { fillBody(body, payload); placePeek(); if (peekStick) body.scrollTop = body.scrollHeight; }
    }
  } finally { peekBusy = false; }
}

function placePeek() {
  const card = document.querySelector('.peek');
  if (!card) return;
  const body = card.querySelector('.peek-body');
  card.classList.remove('flip'); body.style.maxHeight = '';
  if (getComputedStyle(card).position === 'fixed') return;  // docked by CSS in the wide layout
  const anchor = card.parentElement.getBoundingClientRect();
  const below = innerHeight - anchor.bottom - 12, above = anchor.top - 12;
  const flip = card.getBoundingClientRect().bottom > innerHeight - 8 && above > below;  // open upwards when the other side has more room
  card.classList.toggle('flip', flip);
  const room = flip ? above : below;
  if (card.offsetHeight > room) body.style.maxHeight = Math.max(40, room - (card.offsetHeight - body.offsetHeight)) + 'px';
}

const resetPeek = () => { peekPayload = null; peekStick = true; };

function openPeek(id) {
  peeking = id; resetPeek(); sendNote = null; closing = false;
  peekEnter = !reduceMotion;
  render(); peekTick();
}

function closePeek() {
  if (!peeking || closing) return;
  const id = peeking, card = document.querySelector('.peek'), refocus = card?.contains(document.activeElement);
  const finish = () => { peeking = null; closing = false; render(); if (refocus) document.querySelector(`[data-key="v${id}"]`)?.focus(); };
  if (!card || reduceMotion) return finish();
  closing = true;
  card.classList.remove('enter'); card.classList.add('leave');
  card.addEventListener('animationend', e => e.target === card && closing && finish());
  setTimeout(() => closing && finish(), 300);
}

let xtermReady;
const loadXterm = () => xtermReady ??= new Promise((resolve, reject) => {  // ~300 KB: only fetched when a terminal is opened
  document.head.append(build('link', { rel: 'stylesheet', href: '/vendor/xterm.css' }));
  document.head.append(build('script', { src: '/vendor/xterm.js', onload: resolve, onerror: () => { xtermReady = null; reject(new Error('xterm.js failed to load')); } }));
});

const TERM_KEYS = [['Esc', '\x1b'], ['Tab', '\t'], ['⇧Tab', '\x1b[Z'], ['↑', '\x1b[A'], ['↓', '\x1b[B'], ['←', '\x1b[D'], ['→', '\x1b[C'], ['Enter', '\r'], ['Ctrl+C', '\x03']];

async function openTerminal(s) {
  try { await loadXterm(); } catch { sendNote = { kind: 'error', text: 'Could not load the terminal' }; renderNote(); return; }
  const r = await post('/api/term-ticket', { id: s.id });
  if (!r.ok) { sendNote = { kind: 'error', text: r.status === 404 ? 'Session is not open in iTerm' : 'Could not open the terminal' }; renderNote(); return; }
  const { ticket } = await r.json();

  const term = new Terminal({ cols: 100, rows: 30, scrollback: 0, cursorBlink: false, macOptionIsMeta: true, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', fontSize: 13,
    theme: { background: '#161618', foreground: '#e6e6e6', cursor: '#e6e6e6' } });
  const host = build('div', { className: 'term-host', testid: 'term-host' });
  const status = build('span', { className: 'status', textContent: 'connecting…', testid: 'term-status' });
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/term?ticket=${ticket}`);
  const send = (t, d) => ws.readyState === 1 && ws.send(JSON.stringify({ t, d }));
  const close = () => { removeEventListener('resize', fit); ws.close(); term.dispose(); view.remove(); document.querySelector('[data-testid="peek-terminal"]')?.focus(); };  // the card re-renders while open, so the old button is gone
  const reconnect = build('button', { textContent: 'Reconnect', hidden: true, testid: 'term-reconnect', onclick: () => { close(); openTerminal(s); } });
  const view = build('div', { className: 'term-view', role: 'dialog', 'aria-label': `Terminal of ${s.name}`, testid: 'term-view' }, [
    build('div', { className: 'term-bar' }, [
      build('span', { className: 'name', textContent: s.name }), status, reconnect,
      build('button', { textContent: 'Close (Ctrl+])', 'aria-label': 'Close terminal', testid: 'term-close', onclick: close }),
    ]),
    host,
    build('div', { className: 'term-keys', role: 'group', 'aria-label': 'Special keys' }, TERM_KEYS.map(([label, seq]) =>
      build('button', { textContent: label, onclick: () => { send('in', seq); term.focus(); } }))),
  ]);
  document.body.append(view);
  term.open(host);

  const ratio = (() => {  // width of one monospace cell per pixel of font size
    const m = build('span', { textContent: 'M'.repeat(50), style: 'position:absolute;visibility:hidden;white-space:pre;font:100px ui-monospace, SFMono-Regular, Menlo, monospace' });
    document.body.append(m); const w = m.getBoundingClientRect().width / 5000; m.remove(); return w;
  })();
  function fit() {  // scale the font so the session's whole screen fits; the real session is never resized
    const avail = host.getBoundingClientRect(), screen = host.querySelector('.xterm-screen');
    let size = Math.min(20, Math.floor((avail.width - 16) / (term.cols * ratio)));
    for (; size > 6; size--) {
      term.options.fontSize = size;
      const box = screen.getBoundingClientRect();
      if (box.width <= avail.width - 16 && box.height <= avail.height - 16) break;
    }
  }
  addEventListener('resize', fit);

  ws.onopen = () => { status.textContent = 'live'; status.classList.add('live'); term.focus(); };
  ws.onmessage = e => {
    const f = JSON.parse(e.data);
    if (f.cols !== term.cols || f.rows !== term.rows) { term.resize(f.cols, f.rows); fit(); }
    term.write(f.data);
  };
  ws.onclose = () => { status.textContent = 'disconnected'; status.classList.remove('live'); reconnect.hidden = false; };
  term.onData(d => send('in', d));
  term.textarea.addEventListener('paste', e => { e.preventDefault(); e.stopImmediatePropagation(); send('paste', e.clipboardData.getData('text')); }, true);  // bracketed, so multi-line text isn't submitted line by line
  term.attachCustomKeyEventHandler(e => { if (e.type === 'keydown' && e.ctrlKey && e.key === ']') { close(); return false; } return true; });
}

const setPeekWidth = px => {
  const w = Math.round(Math.min(Math.max(px, 320), innerWidth * 0.7));
  document.documentElement.style.setProperty('--peek-w', w + 'px'); store.set('peekWidth', w);
};
if (store.get('peekWidth')) document.documentElement.style.setProperty('--peek-w', store.get('peekWidth') + 'px');
let resizing = false;  // pauses re-rendering so the handle isn't replaced mid-drag

function resizeHandle() {
  const handle = build('div', { className: 'peek-resize', role: 'separator', 'aria-orientation': 'vertical', 'aria-label': 'Resize panel (arrow keys)', tabIndex: 0, testid: 'peek-resize' });
  const width = () => handle.parentElement.getBoundingClientRect().width;
  handle.onpointerdown = e => {
    resizing = true; handle.setPointerCapture(e.pointerId);
    handle.onpointermove = ev => setPeekWidth(innerWidth - 16 - ev.clientX);
    handle.onpointerup = () => { resizing = false; handle.onpointermove = handle.onpointerup = null; };
  };
  handle.onkeydown = e => {
    const step = e.key === 'ArrowLeft' ? 24 : e.key === 'ArrowRight' ? -24 : 0;
    if (step) { e.preventDefault(); setPeekWidth(width() + step); }
  };
  return handle;
}

function peekPanel(s) {
  const body = build('div', { className: 'peek-body ' + peekMode, testid: 'peek-body', tabIndex: 0, 'aria-label': `${peekMode} of ${s.name}` });
  if (peekPayload) fillBody(body, peekPayload); else body.textContent = 'Loading…';
  body.onscroll = () => { peekStick = body.scrollHeight - body.scrollTop - body.clientHeight < 8; };
  const seg = (mode, label) => build('button', { className: 'seg', textContent: label, 'aria-pressed': String(peekMode === mode), testid: 'peek-tab-' + mode,
    onclick: () => { peekMode = mode; resetPeek(); render(); peekTick(); } });
  const input = build('input', { className: 'composer-input', value: sendText, maxLength: 2000, testid: 'send-input', 'aria-label': `Send a message to ${s.name}`,
    placeholder: s.state === 'busy' ? 'Send (will queue)…' : 'Send a message…' });
  input.oninput = () => { sendText = input.value; };
  const action = (label, payload, title, confirm) => {
    const btn = build('button', { className: 'pill', type: 'button', textContent: label, title, testid: 'send-quick' });
    let timer;
    btn.onclick = () => {
      if (!confirm || btn.dataset.armed) { clearTimeout(timer); delete btn.dataset.armed; btn.textContent = label; sendTo(s, payload); return; }
      btn.dataset.armed = '1'; btn.textContent = `Confirm ${label}?`;
      timer = setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; }, 3000);
    };
    return btn;
  };
  return build('div', { className: 'peek' + (peekEnter ? ' enter' : ''), role: 'dialog', 'aria-label': `Peek at ${s.name}`, testid: 'peek' }, [
    resizeHandle(),
    build('div', { className: 'peek-head' }, [
      build('div', { className: 'seg-group', role: 'group', 'aria-label': 'View' }, [seg('transcript', 'Transcript'), seg('screen', 'Screen')]),
      build('span', { className: 'peek-title', textContent: s.name }),
      (data.remote || innerWidth >= 520) && build('button', { className: 'icon', textContent: '⌨', title: 'Open a live terminal', 'aria-label': 'Open terminal', testid: 'peek-terminal', onclick: () => openTerminal(s) }),
      build('button', { className: 'icon', textContent: '✕', title: 'Close (Esc)', 'aria-label': 'Close peek', testid: 'peek-close', onclick: closePeek }),
    ]),
    body,
    build('form', { className: 'composer', onsubmit: e => { e.preventDefault(); if (input.value.trim()) sendTo(s, { text: input.value }); } }, [
      input, build('button', { className: 'send-btn', type: 'submit', textContent: '↑', title: 'Send (Enter)', 'aria-label': 'Send', testid: 'send-submit' }),
    ]),
    build('div', { className: 'actions' }, [
      action('⎋ Interrupt', { key: 'esc' }, 'Send Esc to interrupt the session'),
      action('/clear', { text: '/clear' }, 'Clear the conversation', true),
      build('span', { className: 'hint', textContent: '↵ send · esc close' }),
    ]),
    build('div', { className: 'send-note', testid: 'send-note', role: 'status' }),
  ]);
}

function startRename(s, row) {
  if (editing) return;
  editing = true;
  const input = build('input', { className: 'field', value: s.name, placeholder: s.auto, maxLength: 80, testid: 'session-rename-input', 'aria-label': `New name for ${s.auto} (empty resets)` });
  const finish = async save => {
    if (!editing) return;
    editing = false;
    if (save) await post('/api/rename', { id: s.id, name: input.value });
    sig = ''; refresh();
  };
  input.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); };
  input.onblur = () => finish(false);
  row.replaceWith(build('div', { className: 'row' }, [build('span', { className: 'dot ' + s.state }), input]));
  input.focus(); input.select();
}

const prLabel = s => `PR #${s.pr.number}${s.pr.isDraft ? ' draft' : ''} · ${s.pr.state.toLowerCase()}`;

function sessionRow(s) {
  const b = build('button', { className: 'row', title: s.cwd, key: 's' + s.id, testid: 'session-' + s.state,
    'aria-label': `${s.name}, ${s.label}${s.unseen ? ', unseen' : ''}`, onclick: e => {
      e.currentTarget.blur();
      if (!data.remote) return post('/api/focus', { id: s.id });
      e.stopPropagation();  // otherwise the click-outside handler closes the peek this row just opened
      peeking === s.id ? closePeek() : openPeek(s.id);
    } }, [
    build('span', { className: 'dot ' + s.state }),
    build('span', { className: 'body' }, [
      build('div', { className: 'name', textContent: s.name, title: s.auto !== s.name ? `Claude's name: ${s.auto}` : '' }),
      build('div', { className: 'meta' }, [
        build('span', { textContent: `${s.label} · ${ago(s.since)}` }),
        s.ctx > 0 && build('span', { textContent: `ctx ${s.ctx}%`, title: 'context used (assumes 1M window)' }),
        s.jira && build('span', { textContent: s.jira }),
        s.branch && build('span', { textContent: s.branch, title: 'branch' }),
      ]),
    ]),
    s.unseen && build('span', { className: 'new', textContent: 'new' }),
  ]);
  b.onkeydown = e => { if (e.key === 'F2') { e.preventDefault(); startRename(s, b); } };
  return build('div', { className: 'item' + (peeking === s.id ? ' peeked' : '') }, [
    b,
    build('button', { className: 'icon peek-btn', textContent: '👁', key: 'v' + s.id, title: 'Peek and send', 'aria-label': `Peek at ${s.name}`, 'aria-expanded': String(peeking === s.id), testid: 'session-peek',
      onclick: () => peeking === s.id ? closePeek() : openPeek(s.id) }),
    build('button', { className: 'icon edit', textContent: '✎', key: 'e' + s.id, title: 'Rename (F2)', 'aria-label': `Rename ${s.name}`, testid: 'session-rename', onclick: () => startRename(s, b) }),
    s.pr && build('div', { className: 'meta', style: 'padding:0 8px 4px 25px' }, [
      data.remote
        ? build('a', { className: 'chip', key: 'c' + s.id, textContent: prLabel(s), href: s.pr.url, target: '_blank', rel: 'noopener' })
        : build('button', { className: 'chip', key: 'c' + s.id, textContent: prLabel(s), onclick: () => post('/api/open-pr', { url: s.pr.url }) }),
    ]),
    peeking === s.id && peekPanel(s),
  ]);
}

function render() {
  const q = $('#filter').value.toLowerCase(), hideH = +$('#hide').value;
  const visible = s => (!q || [s.name, s.project, s.branch, s.jira].join(' ').toLowerCase().includes(q))
    && !(hideH && s.state === 'idle' && !s.unseen && Date.now() - s.since > hideH * 3600e3);
  const groups = data.groups.map(g => ({ ...g, sessions: g.sessions.filter(visible) })).filter(g => g.sessions.length)
    .sort((a, b) => pinned.has(b.project) - pinned.has(a.project) || a.project.localeCompare(b.project));
  if (peeking && !data.groups.some(g => g.sessions.some(s => s.id === peeking))) peeking = null;
  const open = $('#closed')?.open;
  const key = document.hasFocus() ? document.activeElement?.dataset.key : null;  // never refocus: it steals keyboard focus from the terminal
  $('#list').replaceChildren(...[
    ...groups.map(g => {
      const folded = isCollapsed(g);
      return build('section', { className: 'group' }, [
        build('header', {}, [
          build('h2', {}, [build('button', { className: 'fold', key: 'f' + g.project, 'aria-expanded': String(!folded), title: folded ? 'Expand' : 'Collapse',
            onclick: () => toggle(collapsed, g.project, 'collapsed') }, [
            build('span', { textContent: folded ? '▸' : '▾', 'aria-hidden': 'true' }),
            build('span', { textContent: g.project }),
            folded && build('span', { className: 'dots' }, g.sessions.map(x => build('span', { className: 'dot ' + x.state, title: `${x.name}: ${x.label}` }))),
          ])]),
          build('button', { className: 'icon', textContent: '★', title: 'Pin project', key: 'p' + g.project, 'aria-pressed': String(pinned.has(g.project)), onclick: () => toggle(pinned, g.project, 'pinned') }),
          build('button', { className: 'icon', textContent: '+', key: 'n' + g.project, title: `New Claude session in ${g.project}`, onclick: () => post('/api/new', { root: g.root }) }),
        ]),
        build('div', { className: 'items' }, folded ? [] : g.sessions.map(sessionRow)),
      ]);
    }),
    !groups.length && build('div', { className: 'empty', textContent: 'No sessions' }),
    data.closed.length ? build('details', { id: 'closed', open }, [
      build('summary', { textContent: 'Recently closed' }),
      ...data.closed.map(c => build('button', { className: 'row', title: `claude --resume ${c.id}`, onclick: () => post('/api/resume', { id: c.id }) }, [
        build('span', { className: 'body' }, [build('div', { className: 'name', textContent: c.name }), build('div', { className: 'meta', textContent: `${c.project} · closed ${ago(c.closedAt)} ago · resume` })]),
      ])),
    ]) : null,
  ].filter(Boolean));
  if (key) document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.focus();
  renderLimits();
  const pre = document.querySelector('[data-testid="peek-body"]');
  if (pre && peekStick) pre.scrollTop = pre.scrollHeight;
  renderNote();
  placePeek();
  peekEnter = false;
}

const fmtReset = (epoch, long) => new Date(epoch * 1000).toLocaleString([], long ? { weekday: 'short', hour: '2-digit', minute: '2-digit' } : { hour: '2-digit', minute: '2-digit' });

function renderLimits() {
  const rows = [['5h', 'five_hour'], ['7d', 'seven_day']].flatMap(([label, key]) => {
    const w = data.limits?.[key];
    if (!w) return [];
    const pct = Math.round(w.pct), level = pct >= 90 ? 'high' : pct >= 70 ? 'warn' : '';
    const reset = w.stale ? 'resets after next response' : '↻ ' + fmtReset(w.resets_at, key === 'seven_day');  // stale: window rolled over, value updates with the next response
    const text = w.stale ? `${label} window reset` : `${pct}% used, resets ${reset.slice(2)}`;
    return [build('div', { className: `limit ${level} ${w.stale ? 'stale' : ''}`, testid: 'limit-' + key, role: 'meter', 'aria-label': `${label} usage limit`,
      'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': pct, 'aria-valuetext': text, title: text }, [
      build('span', { textContent: label }),
      build('div', { className: 'track' }, [build('div', { className: 'fill', style: `width:${Math.min(pct, 100)}%` })]),
      build('span', { className: 'pct', textContent: w.stale ? '–' : pct + '%' }),
      build('span', { className: 'reset', textContent: reset }),
    ])];
  });
  $('#limits').replaceChildren(...rows);
}

let sig = '', last = 0, version;
async function refresh() {
  try {
    data = await (await get('/api/sessions')).json();
    if (version && data.version !== version) return location.reload();  // UI file changed: toolbelt web views never reload on their own
    version = data.version;
    const now = JSON.stringify(data);
    const typing = document.activeElement?.tagName === 'INPUT' && $('#list').contains(document.activeElement);
    if (!editing && !typing && !closing && !resizing && (now !== sig || Date.now() - last > 10000)) { sig = now; last = Date.now(); render(); }
  }
  catch { $('#list').replaceChildren(build('div', { className: 'err', textContent: 'sidebar daemon unreachable' })); }
}
$('#filter').oninput = () => { store.set('filter', $('#filter').value); render(); };
$('#hide').onchange = () => { store.set('hide', $('#hide').value); render(); };
document.addEventListener('click', e => { if (peeking && !e.target.closest('.peek, .term-view, [data-testid="session-peek"]')) closePeek(); });
let placeQueued = false;  // resize/scroll fire in bursts; place once per frame
const placeSoon = () => { if (!placeQueued) { placeQueued = true; requestAnimationFrame(() => { placeQueued = false; placePeek(); }); } };
addEventListener('resize', placeSoon);
addEventListener('scroll', placeSoon, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && peeking && !e.target.closest('.term-view')) closePeek(); });
refresh(); setInterval(refresh, 1000); setInterval(peekTick, 1000);
</script>
</body>
</html>
